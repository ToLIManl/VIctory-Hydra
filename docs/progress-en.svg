<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="VIctory-Hydra progress tracker (PortWatch VI methodology)">
  <defs>
    <linearGradient id="pwGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a5cff"/>
      <stop offset="55%" stop-color="#ff2e7e"/>
      <stop offset="100%" stop-color="#ff7a45"/>
    </linearGradient>
    <clipPath id="mainFillClip">
      <rect x="32" y="168" width="737" height="24" rx="12"/>
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Outer card -->
  <rect x="8" y="8" width="944" height="404" rx="16" fill="#0d0f17" stroke="#222638" stroke-width="1.5"/>

  <!-- Top header -->
  <text x="32" y="40" class="sans" font-size="11" font-weight="700" letter-spacing="1.3" fill="#8b92a6">
    VICTORY-HYDRA · PROGRESS TRACKER (PORTWATCH VI METHODOLOGY)
  </text>

  <!-- Giant score -->
  <text x="32" y="92" class="sans" font-size="48" font-weight="800" fill="url(#pwGrad)">82.2<tspan font-size="24" dx="3" dy="-18" fill="#ff2e7e">%</tspan></text>
  <text x="32" y="114" class="sans" font-size="12.5" fill="#9ca3b8">
    Self-assessed on RTX 3060 12GB + Ryzen 5 5600X · Stages 1–10 Wave 1 (+5.4% since Stage 7B)
  </text>

  <!-- 4 Stat tiles -->
  <g transform="translate(476, 36)">
    <rect x="0" y="0" width="106" height="68" rx="10" fill="#151824" stroke="#23283c"/>
    <text x="12" y="30" class="sans" font-size="17" font-weight="700" fill="#f1f3f9">Playable</text>
    <text x="12" y="50" class="sans" font-size="11" fill="#8b92a6">Milestone</text>

    <rect x="114" y="0" width="106" height="68" rx="10" fill="#151824" stroke="#23283c"/>
    <text x="126" y="30" class="sans" font-size="17" font-weight="700" fill="#f1f3f9">26–31 FPS</text>
    <text x="126" y="50" class="sans" font-size="11" fill="#8b92a6">Light scenes</text>

    <rect x="228" y="0" width="106" height="68" rx="10" fill="#151824" stroke="#23283c"/>
    <text x="240" y="30" class="sans" font-size="17" font-weight="700" fill="#f1f3f9">17–21 FPS</text>
    <text x="240" y="50" class="sans" font-size="11" fill="#8b92a6">Heavy scenes</text>

    <rect x="342" y="0" width="110" height="68" rx="10" fill="#151824" stroke="#23283c"/>
    <text x="354" y="30" class="sans" font-size="17" font-weight="700" fill="#f1f3f9">Stage 10</text>
    <text x="354" y="50" class="sans" font-size="11" fill="#8b92a6">Wave 1 · Next: W2</text>
  </g>

  <!-- Callout pill above bar (82.2% = x 769) -->
  <path d="M 769 156 C 769 162, 769 164, 769 168" stroke="#ff2e7e" stroke-width="2" fill="none"/>
  <rect x="691" y="132" width="156" height="24" rx="12" fill="#1b1529" stroke="#ff2e7e" stroke-width="1.2"/>
  <circle cx="705" cy="144" r="4" fill="#ff2e7e"/>
  <text x="715" y="148" class="sans" font-size="11.5" font-weight="700" fill="#f3f5fa">VIctory-Hydra · 82.2%</text>

  <!-- Main progress bar track + fill + 10..50% segment dividers -->
  <rect x="32" y="168" width="896" height="24" rx="12" fill="#1b1e2d"/>
  <g clip-path="url(#mainFillClip)">
    <rect x="32" y="168" width="896" height="24" fill="url(#pwGrad)"/>
  </g>
  <rect x="121" y="168" width="2.5" height="24" fill="#0d0f17"/>
  <rect x="210" y="168" width="2.5" height="24" fill="#0d0f17"/>
  <rect x="300" y="168" width="2.5" height="24" fill="#0d0f17"/>
  <rect x="389" y="168" width="2.5" height="24" fill="#0d0f17"/>
  <rect x="479" y="168" width="2.5" height="24" fill="#0d0f17"/>

  <!-- Milestone row 1: 0%, 20%, 40%, 100% -->
  <text x="32" y="210" class="sans" font-size="11" fill="#8b92a6">0%</text>
  <circle cx="37" cy="224" r="4" fill="#ff2e7e"/>
  <text x="46" y="228" class="sans" font-size="12" font-weight="700" fill="#e8ebf4">Groundwork</text>

  <text x="211" y="210" class="sans" font-size="11" fill="#8b92a6">20%</text>
  <circle cx="216" cy="224" r="4" fill="#ff2e7e"/>
  <text x="225" y="228" class="sans" font-size="12" font-weight="700" fill="#e8ebf4">First frame</text>

  <text x="390" y="210" class="sans" font-size="11" fill="#8b92a6">40%</text>
  <circle cx="395" cy="224" r="4" fill="#ff2e7e"/>
  <text x="404" y="228" class="sans" font-size="12" font-weight="700" fill="#e8ebf4">In the world</text>

  <text x="530" y="216" class="sans" font-size="11" fill="#787f96">
    Story progress · Rendering · Performance · Stability
  </text>

  <text x="928" y="210" text-anchor="end" class="sans" font-size="11" fill="#8b92a6">100%</text>
  <circle cx="854" cy="224" r="4" fill="#0d0f17" stroke="#ff2e7e" stroke-width="2"/>
  <text x="928" y="228" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#9ca3b8">Complete</text>

  <!-- Milestone row 2: 10%, 30%, 50% -->
  <text x="122" y="246" class="sans" font-size="11" fill="#8b92a6">10%</text>
  <circle cx="127" cy="260" r="4" fill="#ff2e7e"/>
  <text x="136" y="264" class="sans" font-size="12" font-weight="700" fill="#e8ebf4">Exe runs</text>

  <text x="301" y="246" class="sans" font-size="11" fill="#8b92a6">30%</text>
  <circle cx="306" cy="260" r="4" fill="#ff2e7e"/>
  <text x="315" y="264" class="sans" font-size="12" font-weight="700" fill="#e8ebf4">Main menu</text>

  <text x="480" y="246" class="sans" font-size="11" fill="#8b92a6">50%</text>
  <circle cx="485" cy="260" r="4" fill="#ff2e7e"/>
  <text x="494" y="264" class="sans" font-size="12" font-weight="700" fill="#e8ebf4">Playable</text>

  <!-- Divider -->
  <line x1="32" y1="284" x2="928" y2="284" stroke="#1f2436" stroke-width="1"/>

  <!-- 4 Subsystem sub-progress bars -->
  <!-- 1: Story progress (35% -> width 66/188) -->
  <g transform="translate(32, 300)">
    <rect x="0" y="0" width="212" height="92" rx="10" fill="#131622" stroke="#22273a"/>
    <text x="12" y="24" class="sans" font-size="12.5" font-weight="700" fill="#edf0f7">Story progress</text>
    <text x="200" y="24" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#ff5b91">35%</text>
    <text x="12" y="44" class="sans" font-size="11" fill="#8b92a6">Prologue cleared · open world</text>
    <text x="12" y="59" class="mono" font-size="10" fill="#687086">6.1 / 17.5 pts</text>
    <rect x="12" y="70" width="188" height="8" rx="4" fill="#1e2235"/>
    <rect x="12" y="70" width="66" height="8" rx="4" fill="url(#pwGrad)"/>
  </g>

  <!-- 2: Rendering (85% -> width 160/188) -->
  <g transform="translate(260, 300)">
    <rect x="0" y="0" width="212" height="92" rx="10" fill="#131622" stroke="#22273a"/>
    <text x="12" y="24" class="sans" font-size="12.5" font-weight="700" fill="#edf0f7">Rendering</text>
    <text x="200" y="24" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#ff5b91">85%</text>
    <text x="12" y="44" class="sans" font-size="11" fill="#8b92a6">LUT, clouds, water &amp; BC7 fixed</text>
    <text x="12" y="59" class="mono" font-size="10" fill="#687086">10.6 / 12.5 pts · 305+ shader tests</text>
    <rect x="12" y="70" width="188" height="8" rx="4" fill="#1e2235"/>
    <rect x="12" y="70" width="160" height="8" rx="4" fill="url(#pwGrad)"/>
  </g>

  <!-- 3: Performance (70% -> width 132/188) -->
  <g transform="translate(488, 300)">
    <rect x="0" y="0" width="212" height="92" rx="10" fill="#131622" stroke="#22273a"/>
    <text x="12" y="24" class="sans" font-size="12.5" font-weight="700" fill="#edf0f7">Performance</text>
    <text x="200" y="24" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#ff5b91">70%</text>
    <text x="12" y="44" class="sans" font-size="11" fill="#8b92a6">17–21 heavy · 26–31 light FPS</text>
    <text x="12" y="59" class="mono" font-size="10" fill="#687086">7.0 / 10.0 pts · CPU prep ~2x faster</text>
    <rect x="12" y="70" width="188" height="8" rx="4" fill="#1e2235"/>
    <rect x="12" y="70" width="132" height="8" rx="4" fill="url(#pwGrad)"/>
  </g>

  <!-- 4: Stability (85% -> width 160/188) -->
  <g transform="translate(716, 300)">
    <rect x="0" y="0" width="212" height="92" rx="10" fill="#131622" stroke="#22273a"/>
    <text x="12" y="24" class="sans" font-size="12.5" font-weight="700" fill="#edf0f7">Stability</text>
    <text x="200" y="24" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#ff5b91">85%</text>
    <text x="12" y="44" class="sans" font-size="11" fill="#8b92a6">D3D12 538/646 + HeapId + Clamps</text>
    <text x="12" y="59" class="mono" font-size="10" fill="#687086">8.5 / 10.0 pts · CI &amp; WARP green</text>
    <rect x="12" y="70" width="188" height="8" rx="4" fill="#1e2235"/>
    <rect x="12" y="70" width="160" height="8" rx="4" fill="url(#pwGrad)"/>
  </g>
</svg>
